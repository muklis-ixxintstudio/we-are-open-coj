
<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cup of Journey - Opening Hours</title>

<style>

/* RESET */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent !important;
}

body {
  font-family: Georgia, serif;
}

/* OPENING SECTION */

.opening-section {
  min-height: 100vh;
  background: transparent !important;
  color: #23483b;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;
  text-align: center;
}

.container {
  background: transparent !important;
  box-shadow: none !important;
  width: 100%;
  max-width: 700px;
}

/* LOGO */

.logo {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 5px;
  margin-bottom: 35px;
  color: #23483b;
}

/* MAIN STATUS LINK */

.open-link {
  display: inline-block;
  position: relative;
  z-index: 10;

  font-family: Georgia, serif;
  font-size: clamp(35px, 8vw, 75px);
  font-weight: normal;

  color: #23483b;
  text-decoration: none;
  cursor: pointer;

  margin-bottom: 20px;

  animation: blink 2s ease-in-out infinite;

  transition: color 0.3s ease;
}

.open-link:hover {
  color: #c7a66a;
}

/* BLINK ANIMATION */

@keyframes blink {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: 0.45;
  }
}

/* DESCRIPTION */

.description {
  font-size: 11px;
  letter-spacing: 0.5px;
  line-height: 1.1;
  color: #23483b;
}

/* DIVIDER */

.divider {
  width: 60px;
  height: 1px;
  background: #c7a66a;
  margin: 40px auto;
}

/* HOURS */

.days {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: #f1e8d6;
  margin-bottom: 15px;
}

.hours {
  font-size: clamp(25px, 5vw, 36px);
  letter-spacing: 2px;
  font-weight: normal;
  color: #f1e8d6;
}

/* OPENING STATUS BADGE */

.status {
  display: inline-flex;
  align-items: center;
  gap: 12px;

  margin-top: 35px;
  padding: 13px 22px;

  background: transparent;
  border: 1px solid #ffffff35;
  border-radius: 50px;

  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;

  transition: .4s;
}

/* STATUS DOT */

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

/* OPEN */

.status.open {
  color: #f1e8d6;
  border-color: #f1e8d6;
}

.status.open .dot {
  background: #8fc99a;
  box-shadow: 0 0 12px #8fc99a;
  animation: pulse 1.5s infinite;
}

/* CLOSED */

.status.closed {
  color: #b21500;
  border-color: #b21500;
}

.status.closed .dot {
  background: #b21500;
  box-shadow: 0 0 8px #b21500;
}

/* PULSE ANIMATION */

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 #8fc99a80;
  }

  70% {
    box-shadow: 0 0 0 9px #8fc99a00;
  }

  100% {
    box-shadow: 0 0 0 0 #8fc99a00;
  }
}

/* FOOTER */

.footer-text {
  margin-top: 50px;
  font-size: 12px;
  letter-spacing: 2px;
  color: #f1e8d6;
}

/* MOBILE */

@media (max-width: 480px) {

  .opening-section {
    padding: 20px;
  }

  .logo {
    margin-bottom: 25px;
  }

  .description {
    font-size: 10px;
  }

  .days {
    letter-spacing: 3px;
  }

  .footer-text {
    font-size: 10px;
  }

}

</style>
</head>

<body>

<section class="opening-section">

  <div class="container">

    <div class="logo">
      CUP OF JOURNEY
    </div>

    <!-- KLIK STATUS UNTUK MEMBUKA GOOGLE MAPS -->

    <a
      href="https://www.google.com/maps/place/Cup+of+journey/@5.8665233,95.3156383,17z/data=!3m1!4b1!4m6!3m5!1s0x3041c9c2c008246d:0x1984a3ca047fb349!8m2!3d5.8665233!4d95.3182132!16s%2Fg%2F11vrxmcz6d"
      target="_blank"
      rel="noopener noreferrer"
      class="open-link"
      id="mainStatus"
    >
      WE ARE OPEN
    </a>

    <p class="description">
      Setiap hari adalah hari yang baik untuk menikmati kopi.
      Luangkan sejenak waktu, nikmati perjalanannya,
      dan biarkan kopi menuturkan kisahnya.
    </p>

    <div class="divider"></div>

    <div class="days">
      MONDAY — SUNDAY
    </div>

    <div class="hours">
      09.00 — 23.00
    </div>

    <div class="status" id="openingStatus">

      <span class="dot"></span>

      <span id="statusText">
        CHECKING STATUS...
      </span>

    </div>

    <div class="footer-text">
      SABANG · ACEH · INDONESIA
    </div>

  </div>

</section>

<script>

// CUP OF JOURNEY OPENING HOURS

function updateStatus() {

  // Waktu Sabang / WIB

  const now = new Date();

  const time = new Intl.DateTimeFormat(
    "en-GB",
    {
      timeZone: "Asia/Jakarta",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }
  ).format(now);

  const parts = time.split(":");

  const hour = Number(parts[0]);
  const minute = Number(parts[1]);

  const currentMinutes = hour * 60 + minute;

  // Jam operasional 09.00 - 23.00

  const openingTime = 9 * 60;
  const closingTime = 23 * 60;

  const isOpen =
    currentMinutes >= openingTime &&
    currentMinutes < closingTime;

  const status = document.getElementById(
    "openingStatus"
  );

  const text = document.getElementById(
    "statusText"
  );

  const mainStatus = document.getElementById(
    "mainStatus"
  );

  // STATUS OTOMATIS

  if (isOpen) {

    mainStatus.textContent = "WE ARE OPEN";
    status.classList.add("open");
    status.classList.remove("closed");
    text.textContent = "OPEN NOW";

  } else {

    mainStatus.textContent = "WE ARE CLOSED";
    status.classList.add("closed");
    status.classList.remove("open");
    text.textContent = "CLOSED NOW";

  }

}

// JALANKAN SAAT HALAMAN DIBUKA

updateStatus();

// PERBARUI SETIAP 30 DETIK

setInterval(updateStatus, 30000);

</script>

</body>
</html>
